name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # 也可在 Actions 页面手动发布：填写版本号（须与 package.json 一致），由工作流创建 v<版本号> tag
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 1.2.0，留空则只构建不发布）'
        required: false
        default: ''
      prerelease:
        description: '标记为预发布（测试版）：稳定用户的自动更新不会拿到它'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      # 这里用 node 读 package.json 的版本号，必须显式装 Node：
      # runner 自带的版本随镜像变化，而版本号解析错了会直接发错版本
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: v
        name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          PKG=$(node -p "require('./package.json').version")
          if [ -n "$VERSION" ] && [ "$VERSION" != "$PKG" ]; then
            echo "::error::发布版本 $VERSION 与 package.json 版本 $PKG 不一致"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # 预发布：让「测试版本」不进稳定用户的更新通道。
          # 已实测确认（用 electron 自己的仓库对照）：GitHub 的 /releases/latest
          # 与 releases.atom 都会跳过标记为 prerelease 的版本，而 electron-updater
          # 正是靠这两个端点找最新版的，所以稳定用户不会被推到 beta 上。
          PRERELEASE="${{ inputs.prerelease }}"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          if [ "$PRERELEASE" = "true" ]; then
            echo "本次发布标记为**预发布**：稳定用户的自动更新不会拿到它"
          fi

  # ===== 发布门禁：全量测试 =====
  #
  # 发布是不可逆的：产物一旦推给用户，就只能靠下一个版本修回来，
  # 而「下一个版本」本身还得依赖更新通道是好的。所以这里把三平台的
  # 关键回归再跑一遍 —— 平时 CI 已经在跑，这里是**发布前的最后一道闸**，
  # 宁可晚发十分钟，也不要发一个用户装完用不了的版本。
  gate:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - run: pnpm install --frozen-lockfile

      - name: Go 侧车（格式 / 静态检查 / 测试）
        working-directory: backend
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::以下文件未经过 gofmt 格式化："
            echo "$UNFORMATTED"
            exit 1
          fi
          go vet ./...
          go test -shuffle=on -count=1 ./...

      - name: 类型检查
        run: pnpm vue-tsc --noEmit

      - name: 契约与静态校验（IPC / 图标 / 官网 / 依赖清单）
        run: |
          pnpm lint:ipc
          pnpm lint:icons
          pnpm lint:website
          pnpm deps:manifest:check

      - name: 纯逻辑单测
        run: pnpm test

      # 更新流程与设置迁移：发布前必须确认这两层没坏
      - name: 更新流程回归
        run: pnpm test:updater

      - name: 设置迁移与向后兼容
        run: pnpm test:settings:migration

      - name: 下载与解析集成回归
        run: |
          pnpm test:download:integration
          pnpm test:parse:integration

      # 边车必须能编出全部 5 个平台：任一编不过，对应平台的用户就装不上
      - name: 交叉编译全部平台
        working-directory: backend
        shell: bash
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/downvid-deps
            echo "  ok ${target}"
          done

  build-mac-arm64:
    needs: [version, gate]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # 侧车只用标准库，没有 go.sum，无需缓存依赖
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:mac:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac-arm64-builds
          path: |
            release/**/*-arm64-Mac-*.dmg
            release/**/*-arm64-Mac-*.zip
            release/**/latest-mac.yml
            release/**/*.blockmap
          retention-days: 7

  build-mac-x64:
    needs: [version, gate]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # 侧车只用标准库，没有 go.sum，无需缓存依赖
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:mac:x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac-x64-builds
          path: |
            release/**/*-x64-Mac-*.dmg
            release/**/*-x64-Mac-*.zip
            release/**/latest-mac.yml
            release/**/*.blockmap
          retention-days: 7

  build-win:
    needs: [version, gate]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # 侧车只用标准库，没有 go.sum，无需缓存依赖
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_HTTP_TIMEOUT: 600000
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win-builds
          path: |
            release/**/KeepVideo-Setup-*.exe
            release/**/KeepVideo-Portable-*.exe
            release/**/latest.yml
            release/**/*.blockmap
          retention-days: 7

  build-linux-x64:
    needs: [version, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        target: [appimage, deb, rpm, tar.gz]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # 侧车只用标准库，没有 go.sum，无需缓存依赖
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:linux:x64:${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-${{ matrix.target }}
          path: |
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.rpm
            release/**/*-Linux-*.tar.gz
            release/**/*.blockmap
          retention-days: 7

  build-linux-arm64:
    needs: [version, gate]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # 侧车只用标准库，没有 go.sum，无需缓存依赖
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:linux:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-builds
          path: |
            release/**/*-Linux-*.AppImage
            release/**/*-Linux-*.tar.gz
            release/**/latest-linux-arm64.yml
            release/**/*.blockmap
          retention-days: 7

  # ===== 新版桌面客户端（Go + Wails，app/）=====
  #
  # 与上面的 Electron 产物**并行发布**：Electron 老用户仍从 latest*.yml 收到更新，
  # 新客户端用独立前缀 KeepVideo-Desktop-，由 app/internal/update 的 wmlUpdate
  # 按资产名 + checksums.txt 自更新。改这里的产物名必须同步 wml.go 的 wmlAssetRules。
  build-desktop:
    needs: [version, gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            suffix: mac-universal
          - os: windows-latest
            platform: windows/amd64
            suffix: windows-x64
          # Wails v2.16 的 cgo 默认找 webkit2gtk-4.0；24.04 只剩 4.1，所以固定 22.04
          - os: ubuntu-22.04
            platform: linux/amd64
            suffix: linux-x64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 安装 Linux 构建依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      # `wails build -nsis` 依赖 makensis；windows-latest 默认没有，缺失时 flag 会被静默忽略
      - name: 安装 NSIS（仅 Windows）
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: 前端依赖安装
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      # 顺序不能反：generate module 会先编译 Go 包，而 main.go 要求 frontend/dist 已存在
      - name: 准备 embed 目录并生成绑定
        shell: bash
        run: |
          bash app/scripts/prepare-embed-dir.sh
          node scripts/sync-changelog.mjs --check
          cd app && wails generate module

      # 必须用 build.sh：它先编译依赖边车再带 withsidecar 构建，直接 wails build 的产物没有依赖探测能力
      - name: 构建
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            bash app/scripts/build.sh -platform ${{ matrix.platform }} -skipbindings -nsis
          else
            bash app/scripts/build.sh -platform ${{ matrix.platform }} -skipbindings
          fi

      - name: 打包 macOS
        if: matrix.os == 'macos-latest'
        run: |
          OUT="$GITHUB_WORKSPACE/KeepVideo-Desktop-${{ matrix.suffix }}-${VERSION}"
          cd app/build/bin
          codesign --verify --deep --strict --verbose=2 KeepVideo.app
          ditto -c -k --sequesterRsrc --keepParent KeepVideo.app "${OUT}.zip"
          ROOT="$(mktemp -d)"
          mkdir -p "$ROOT/stage/.background"
          cp -R KeepVideo.app "$ROOT/stage/"
          ln -s /Applications "$ROOT/stage/Applications"
          node "$GITHUB_WORKSPACE/scripts/gen-dmg-background.mjs" "$ROOT/stage/.background/background.png"
          printf '%s\n' \
            'Keep Video 尚未使用 Apple 开发者签名，第一次打开可能被 macOS 拦下。' \
            '' \
            '如果提示「已损坏」或「无法打开」：' \
            '  1. 先把 KeepVideo.app 拖进「应用程序」' \
            '  2. 打开「终端」执行：xattr -dr com.apple.quarantine /Applications/KeepVideo.app' \
            '  3. 再双击打开（或右键 → 打开 → 仍要打开）' \
            > "$ROOT/stage/首次打开说明.txt"
          hdiutil create -volname "Keep Video" -srcfolder "$ROOT/stage" -ov -format UDZO -imagekey zlib-level=9 "${OUT}.dmg" >/dev/null
          ls -la "$GITHUB_WORKSPACE"/KeepVideo-Desktop-*

      - name: 打包 Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $v = $env:VERSION
          Compress-Archive -Path app/build/bin/KeepVideo.exe -DestinationPath "KeepVideo-Desktop-windows-x64-$v.zip"
          $installer = Get-ChildItem -Path app/build/bin -Filter "*installer.exe" | Select-Object -First 1
          if (-not $installer) { Write-Error "缺少 NSIS 安装器"; exit 1 }
          Copy-Item $installer.FullName -Destination "KeepVideo-Desktop-windows-x64-$v-installer.exe"
          Get-Item KeepVideo-Desktop-* | Format-List Name, Length

      - name: 打包 Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          tar -czf "KeepVideo-Desktop-${{ matrix.suffix }}-${VERSION}.tar.gz" -C app/build/bin KeepVideo
          DEB="deb-pkg/keepvideo_${VERSION}_amd64"
          mkdir -p "$DEB/usr/bin" "$DEB/usr/share/applications" "$DEB/usr/share/icons/hicolor/512x512/apps" "$DEB/DEBIAN"
          install -m 755 app/build/bin/KeepVideo "$DEB/usr/bin/keepvideo"
          install -m 644 app/build/appicon.png "$DEB/usr/share/icons/hicolor/512x512/apps/keepvideo.png"
          # 用 printf 而不是 heredoc：heredoc 正文顶格写进 YAML 块标量会让整个工作流非法
          printf '%s\n' '[Desktop Entry]' 'Name=Keep Video' 'Comment=Video downloader' 'Exec=/usr/bin/keepvideo' \
            'Icon=keepvideo' 'Terminal=false' 'Type=Application' 'Categories=AudioVideo;Network;Utility;' \
            > "$DEB/usr/share/applications/keepvideo.desktop"
          printf '%s\n' 'Package: keepvideo' "Version: ${VERSION}" 'Section: utils' 'Priority: optional' \
            'Architecture: amd64' 'Maintainer: Keep Video <support@keep.video>' \
            'Depends: libgtk-3-0, libwebkit2gtk-4.0-37' \
            'Description: Keep Video desktop video downloader.' > "$DEB/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$DEB" "KeepVideo-Desktop-${{ matrix.suffix }}-${VERSION}.deb"
          ls -la KeepVideo-Desktop-*

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.suffix }}
          path: |
            KeepVideo-Desktop-*.zip
            KeepVideo-Desktop-*.tar.gz
            KeepVideo-Desktop-*.dmg
            KeepVideo-Desktop-*.exe
            KeepVideo-Desktop-*.deb
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [version, build-mac-arm64, build-mac-x64, build-win, build-linux-x64, build-linux-arm64, build-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.version.outputs.version != ''
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 各 job 生成的 latest*.yml 汇总时会互相覆盖，按最终上传的文件重新生成
      - name: Generate update manifests
        run: node scripts/gen-update-manifests.mjs artifacts "$VERSION"

      # 新版桌面客户端的自更新按 checksums.txt 校验 SHA-256（只收录 KeepVideo-Desktop- 产物）
      - name: Generate desktop checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f -name 'KeepVideo-Desktop-*' -printf '%f\n' | sort | xargs sha256sum > checksums.txt
          test -s checksums.txt
          cat checksums.txt

      # 正文顶部生成「点徽章即下载」的引导区：Release 里 CHANGELOG 内容较长，
      # 此前不少用户拉到页面后不知道点哪里下载。下载链接按实际产物生成，
      # 不会出现指向不存在文件的死链。
      - name: Generate release notes
        id: changelog
        run: |
          node scripts/gen-release-notes.mjs artifacts "$VERSION" CHANGELOG.md > /tmp/release-notes.md
          {
            echo "notes<<RELEASE_NOTES_EOF"
            cat /tmp/release-notes.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # 手动发布时 tag 尚不存在，由 action 在当前提交上创建
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          # 预发布（测试版）：稳定用户的自动更新不会拿到它。
          # 由 workflow_dispatch 的 prerelease 输入决定；打 tag 触发时为 false。
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          body: ${{ steps.changelog.outputs.notes }}
          # Electron 与新版客户端的产物名互不重叠（-Mac-/-Linux- 与 Desktop-mac/linux 大小写不同），
          # 避免同一文件被两条模式重复上传
          files: |
            artifacts/**/KeepVideo-*-Mac-*.dmg
            artifacts/**/KeepVideo-*-Mac-*.zip
            artifacts/**/KeepVideo-Setup-*.exe
            artifacts/**/KeepVideo-Portable-*.exe
            artifacts/**/KeepVideo-*-Linux-*.AppImage
            artifacts/**/KeepVideo-*-Linux-*.deb
            artifacts/**/KeepVideo-*-Linux-*.rpm
            artifacts/**/KeepVideo-*-Linux-*.tar.gz
            artifacts/KeepVideo-Desktop-*
            artifacts/checksums.txt
            artifacts/latest*.yml
            artifacts/**/*.blockmap

      # 发布**完成后**回头核对一次：Release 真的存在、且带着全部平台的更新清单。
      #
      # 为什么需要这一步：实测 `v1.3.5` 的 tag 推上去了、CHANGELOG 也写了，
      # 但这次运行在 3 分钟后**被取消**，于是 GitHub Release 里没有 v1.3.5，
      # 自动更新通道仍指向 v1.3.4 —— 所有存量用户永远收不到这次修复，
      # 而版本号已经继续往前走了。这种失败**没有任何提示**：
      # tag 在、CHANGELOG 在、package.json 也在，只有 Release 页面少了一条。
      #
      # 放在最后而不是依赖 job 的成功状态：被取消时后续步骤不执行，
      # 恰恰是我们希望有人（或下一个版本的发布）注意到的时刻。
      - name: 校验发布完整性
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release.mjs --tag "v${{ env.VERSION }}"
