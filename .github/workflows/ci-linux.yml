name: CI · Linux

# Linux 侧的完整回归。
#
# 为什么按平台拆成三个工作流（而不是一个带 matrix 的大工作流）：
#   1. 失败定位：日志里一眼看出是哪个平台哪一步，而不是「6 个 job 里有一个红」
#   2. 触发与耗时：Windows/macOS runner 排队慢，Linux 能先给出结论
#   3. 平台专属步骤不必写 `if: runner.os == ...`，可读性差且容易写错
#
# 约定：**新增测试脚本必须挂进对应平台的工作流**。曾经 test:acceleration
# 加了脚本却没接进 CI，加速逻辑长期没有自动化验证。
#
# 每一步都单独命名，脚本内部再用 harness 打印逐用例结果 —— 失败时先看步骤名，
# 再看脚本输出的用例名，不用翻 YAML。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Go 侧车只用标准库，没有 go.sum；关掉缓存省一次网络往返
  GOTOOLCHAIN: local

jobs:
  desktop-changes:
    uses: ./.github/workflows/desktop-changes.yml

  # ===== Go 侧车 =====
  backend:
    name: 后端 · Go 侧车
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - name: gofmt（格式）
        working-directory: backend
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::以下文件未经过 gofmt 格式化："
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet（静态检查）
        working-directory: backend
        run: go vet ./...

      # -shuffle=on 打乱用例顺序，能抓出「用例之间共享包级可变状态」的泄漏。
      # 这类问题单跑必过、全量跑才随机失败（已真实发生过：扫描预算的全局变量）。
      - name: go test（打乱顺序）
        working-directory: backend
        run: go test -shuffle=on -count=1 ./...

      # 边车会被交叉编译成 5 个平台的二进制打进安装包，任一平台编不过都是发布事故
      - name: 交叉编译全部平台
        working-directory: backend
        shell: bash
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/downvid-deps
            echo "  ok ${target}"
          done

  # ===== 前端：类型、契约、纯逻辑单测 =====
  frontend:
    name: 前端 · 类型 / 契约 / 单测
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - run: pnpm install --frozen-lockfile

      - name: 类型检查（strict + noUnusedLocals）
        run: pnpm vue-tsc --noEmit

      # IPC 三处（主进程 / preload / env.d.ts）是手工同步的，漏改会静默失败
      - name: IPC 契约校验
        run: pnpm lint:ipc

      # 图标名写错时字体会静默渲染成文字或空白，界面上很难发现
      - name: 图标名校验
        run: pnpm lint:icons

      # 官网是单文件、直接由 Vercel 从 main 发布，中间没有构建步骤：
      # 引错图、漏翻译、配色漂移都只会在线上静默出现
      - name: 官网校验
        run: pnpm lint:website

      - name: 文档一致性校验（AGENTS.md ↔ CLAUDE.md）
        run: pnpm lint:docs

      # 词条漏英文 / 占位符对不上都不会报错，只会静默显示错文案
      - name: i18n 词条校验
        run: pnpm lint:i18n

      # 工作流的错误本地跑什么都发现不了，只能等 CI 变红。
      # 这条静态校验把「用了某工具但没装」变成提交前就能看到的问题。
      - name: 工作流健全性校验
        run: pnpm lint:workflows

      - name: 纯逻辑单测（Vitest）
        run: pnpm test

  # ===== 主进程侧逻辑（不需要真实 Electron）=====
  main-process:
    name: 主进程 · 更新 / 设置 / 清单
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - run: pnpm install --frozen-lockfile

      # 更新是用户拿到修复的唯一通道，也是唯一「坏了就再也修不好」的功能：
      # 存量用户装的是旧版客户端，没有第二次机会。
      - name: 更新流程回归（版本比较 / 缓存 / 兜底 / 各安装方式分支）
        run: pnpm test:updater

      # 设置形状改动会让老用户设置静默失效；合并写入写错会抹掉别的字段
      - name: 设置迁移与向后兼容
        run: pnpm test:settings:migration

      # Issue 自动关闭的分类逻辑：误关一条真实报告比留一条噪音更糟，
      # 用例全部取自仓库里真实出现过的 Issue 正文（#50 #52 #57 #58）
      - name: Issue 分类回归
        run: pnpm test:issue:triage

      # 依赖清单落后或哈希失配会在用户端变成「下载即校验失败」
      - name: 依赖清单与上游一致
        run: pnpm deps:manifest:check

  # ===== 集成回归：起真实进程、真实文件 IO =====
  integration:
    name: 集成 · 下载 / 加速
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - run: pnpm install --frozen-lockfile

      # 下载链路：本地 HTTP 服务 + 真实文件 IO + 真实 Store，仅在边界替换 Electron API
      - name: 下载集成回归
        run: pnpm test:download:integration

      # 加速基准：并发队列、限速场景、可选 aria2。
      # 未提供外部工具路径时只跑内置基准，外部引擎会被明确跳过。
      - name: 加速基准
        run: pnpm test:acceleration

      # 解析链路（抖音/快手解析器与 yt-dlp 回退），只在本地服务上跑
      - name: 解析集成回归
        run: pnpm test:parse:integration

      - name: 单站点服务回归
        run: pnpm test:web

  # ===== 构建与打包 =====
  package:
    name: 打包 · 产物内容校验
    needs: desktop-changes
    if: needs.desktop-changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - run: pnpm install --frozen-lockfile

      - name: 构建前端与主进程
        run: pnpm vite build

      # 校验 electron-builder 配置并打包到目录（不生成安装包），
      # 配置与新版 schema 不兼容时在 PR 阶段即可发现
      - name: 打包到目录
        run: pnpm exec electron-builder --linux dir --publish never --config electron-builder.json5

      # 逐项核对真实产物：边车在不在、有没有误带 yt-dlp/ffmpeg、
      # app.asar 是否完整、package-type 是否存在（决定 deb/rpm 能否自动更新）
      - name: 产物内容校验
        run: pnpm test:package

      # 清单生成脚本自检：用假产物确认不会生成死链
      - name: 更新清单生成脚本自检
        shell: bash
        run: |
          mkdir -p tmp-artifacts
          for f in KeepVideo-Setup-0.0.0.exe KeepVideo-arm64-Mac-0.0.0.zip KeepVideo-x64-Mac-0.0.0.zip KeepVideo-x86_64-Linux-0.0.0.AppImage KeepVideo-amd64-Linux-0.0.0.deb KeepVideo-arm64-Linux-0.0.0.AppImage; do
            echo "$f" > "tmp-artifacts/$f"
          done
          node scripts/gen-update-manifests.mjs tmp-artifacts 0.0.0
          grep -q "KeepVideo-amd64-Linux-0.0.0.deb" tmp-artifacts/latest-linux.yml
          grep -q "KeepVideo-x64-Mac-0.0.0.zip" tmp-artifacts/latest-mac.yml

      - name: Release 正文生成脚本自检
        shell: bash
        run: |
          mkdir -p tmp-release && rm -f tmp-release/*
          for f in KeepVideo-Setup-0.0.0.exe KeepVideo-arm64-Mac-0.0.0.dmg; do
            echo x > "tmp-release/$f"
          done
          node scripts/gen-release-notes.mjs tmp-release 0.0.0 CHANGELOG.md > /tmp/notes.md
          grep -q "KeepVideo-Setup-0.0.0.exe" /tmp/notes.md
          grep -q "更新内容" /tmp/notes.md
          if grep -q "KeepVideo-Portable-0.0.0.exe" /tmp/notes.md; then
            echo "::error::Release 正文引用了不存在的产物（便携版）"
            exit 1
          fi

  # ===== Wails 桌面客户端（app/）=====
  app:
    name: 桌面客户端 · Wails 核心 / 边车 / 前端
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      # Wails v2.16 的 cgo 默认找 webkit2gtk-4.0；ubuntu-24.04 只剩 4.1，所以固定 22.04。
      - name: 安装 GTK / WebKit 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: 前端依赖安装
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      # main.go 的 `//go:embed all:frontend/dist` 要求目录存在，否则 vet / 测试直接编译失败
      - name: 准备 embed 目录
        shell: bash
        run: bash app/scripts/prepare-embed-dir.sh

      - name: gofmt（客户端）
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l app)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::以下文件未经过 gofmt 格式化："
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet / test（核心）
        working-directory: app
        shell: bash
        run: go vet ./... && go test -shuffle=on -count=1 ./...

      - name: go vet / test（依赖边车）
        working-directory: app/sidecar
        shell: bash
        run: go vet ./... && go test -shuffle=on -count=1 ./...

      - name: 内置更新日志与根 CHANGELOG 一致
        run: node scripts/sync-changelog.mjs --check

      # wailsjs 是生成物、不入库；svelte-check 依赖它的类型
      - name: 生成 Wails 绑定
        working-directory: app
        run: wails generate module

      - name: 前端类型检查（svelte-check）
        working-directory: app/frontend
        run: pnpm check

      - name: 前端纯逻辑单测（Vitest）
        working-directory: app/frontend
        run: pnpm test

  app-package:
    name: 桌面客户端 · Wails 单文件构建
    needs: desktop-changes
    if: needs.desktop-changes.outputs.desktop == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      # Wails v2.16 的 cgo 默认找 webkit2gtk-4.0；ubuntu-24.04 只剩 4.1，所以固定 22.04。
      - name: 安装 GTK / WebKit 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: 前端依赖安装
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      # main.go 的 `//go:embed all:frontend/dist` 要求目录存在，否则 vet / 测试直接编译失败
      - name: 准备 embed 目录
        shell: bash
        run: bash app/scripts/prepare-embed-dir.sh

      - name: 生成 Wails 绑定
        working-directory: app
        run: wails generate module

      - name: 构建（含依赖边车）
        shell: bash
        run: bash app/scripts/build.sh -platform linux/amd64

      - name: 产物自检
        shell: bash
        run: |
          BIN=$(find app/build/bin -maxdepth 1 -type f -name KeepVideo | head -1)
          if [ -z "$BIN" ]; then
            echo "::error::构建产物里找不到 Keep Video 可执行文件"
            find app/build/bin -maxdepth 2 | head -20
            exit 1
          fi
          du -sh "$BIN"
